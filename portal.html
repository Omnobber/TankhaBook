<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tankhabook Portal</title>
<style>:root{--bg:#F8FAFC;--ink:#0F172A;--mut:#475569;--pri:#2563EB;--grn:#16A34A;--card:#fff;--line:#D5DEEA;--bad:#B91C1C}@media(prefers-color-scheme:dark){:root{--bg:#0B1220;--ink:#E8EEF8;--mut:#9AA9BF;--pri:#60A5FA;--card:#101A2D;--line:#25324A;--bad:#F87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}.w{max-width:960px;margin:0 auto;padding:20px}h1{font-size:24px;margin:0}a{color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:18px}label{display:block;font-size:14px;color:var(--mut);margin-top:12px}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px}
button{padding:11px 18px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-weight:600;font-size:16px;cursor:pointer;margin-top:16px}button.o{background:none;color:var(--ink);border:1px solid var(--line)}.tabs button{margin:0 8px 0 0}.msg{margin-top:12px;color:var(--bad)}.msg.ok{color:var(--grn)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.t{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}[hidden]{display:none!important}</style></head><body><div class="w">
<header style="display:flex;justify-content:space-between;align-items:center"><h1><a href="index.html" style="text-decoration:none;color:inherit">Tankha<span style="color:var(--pri)">book</span></a> Portal</h1><button class="o" id="lo" hidden>Log out</button></header>
<section id="auth"><div class="card"><div class="tabs"><button data-t="li">Log in</button><button class="o" data-t="rg">Create company account</button><button class="o" data-t="fg">Forgot password</button></div>
<form id="li"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button>Log in</button></form>
<form id="rg" hidden><div class="g"><label>Company name<input name="company" required></label><label>Your name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Mobile (10 digits)<input name="phone" inputmode="numeric" required></label></div><label>Password (min 8 characters)<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><button>Create account</button></form>
<form id="fg" hidden><label>Email<input name="email" type="email" required></label><button>Send reset link</button></form>
<form id="rs" hidden><label>New password (min 8 characters)<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><button>Set new password</button></form>
<p class="msg" id="m" role="status"></p></div></section>
<section id="app" hidden><div class="card"><b id="who"></b></div>
<div class="card"><h2 style="margin:0">Add employee</h2><form id="ef"><div class="g"><label>Employee code<input name="emp_code" required></label><label>Name<input name="name" required></label><label>Mobile<input name="phone" inputmode="numeric"></label><label>Designation<input name="designation"></label><label>Department<input name="department"></label><label>Branch<input name="branch"></label><label>Pay type<select name="pay_type"><option value="monthly">Monthly salary</option><option value="daily">Daily wage</option><option value="hourly">Hourly</option><option value="piece">Piece rate</option></select></label><label>Pay rate (INR)<input name="pay_rate" type="number" min="0" step="0.01" required></label><label>Joining date<input name="joined_on" type="date"></label></div><button>Save employee</button><p class="msg" id="em"></p></form></div>
<div class="card t"><h2 style="margin:0 0 8px">Employees</h2><table><thead><tr><th>Code</th><th>Name</th><th>Mobile</th><th>Pay</th><th>Status</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></section></div>
<script>
var API="https://api.tankhabook.com/",C="",$=function(i){return document.getElementById(i)};
function api(r,d){var post=d!==undefined,o={credentials:"include",headers:{}};if(post){o.method="POST";o.headers["Content-Type"]="application/json";o.headers["X-CSRF-Token"]=C;o.body=JSON.stringify(d)}
return fetch(API+"index.php?r="+r,o).then(function(x){return x.json().then(function(j){if(!x.ok&&j.status!=="success"){var e=new Error(j.message||"Error");e.code=x.status;throw e}return j})})}
function tok(){return api("auth/csrf").then(function(j){C=j.csrf})}
function say(el,t,ok){el.textContent=t;el.className="msg"+(ok?" ok":"")}
function fd(f){var o={};new FormData(f).forEach(function(v,k){o[k]=v});return o}
function show(t){["li","rg","fg","rs"].forEach(function(i){$(i).hidden=i!==t});document.querySelectorAll(".tabs button").forEach(function(b){b.className=b.dataset.t===t?"":"o"});say($("m"),"")}
document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){show(b.dataset.t)}});
function form(id,ep,after){$(id).onsubmit=function(e){e.preventDefault();var btn=this.querySelector("button");btn.disabled=true;api(ep,fd(this)).then(after).catch(function(x){say($("m"),x.message)}).then(function(){btn.disabled=false})}}
function enter(){api("auth/me").then(function(j){$("auth").hidden=true;$("app").hidden=false;$("lo").hidden=false;$("who").textContent=j.user.company+" - "+j.user.name+" ("+j.user.role+")";if(j.user.role=="owner"||j.user.role=="hr")load();else $("ef").parentNode.hidden=true}).catch(function(){})}
form("li","auth/login",function(){return tok().then(enter)});
form("rg","auth/register",function(){return tok().then(enter)});
form("fg","auth/forgot",function(j){say($("m"),j.message,1)});
$("rs").onsubmit=function(e){e.preventDefault();var d=fd(this);d.token=location.hash.slice(7);api("auth/reset",d).then(function(j){history.replaceState(0,"",location.pathname);show("li");say($("m"),j.message,1)}).catch(function(x){say($("m"),x.message)})};
$("lo").onclick=function(){api("auth/logout",{}).then(function(){location.reload()})};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return"&#"+c.charCodeAt(0)+";"})}
function load(){api("employees/list").then(function(j){$("tb").innerHTML=j.employees.map(function(x){return"<tr><td>"+esc(x.emp_code)+"</td><td>"+esc(x.name)+"</td><td>"+esc(x.phone)+"</td><td>"+esc(x.pay_type)+" "+esc(x.pay_rate)+"</td><td>"+esc(x.status)+'</td><td><button class="o" style="margin:0;padding:4px 10px" data-id="'+x.id+'" data-s="'+(x.status=="active"?"inactive":"active")+'">'+(x.status=="active"?"Deactivate":"Activate")+"</button></td></tr>"}).join("")||'<tr><td colspan="6">No employees yet.</td></tr>'})}
$("tb").onclick=function(e){var b=e.target.closest("button");if(b)api("employees/status",{id:+b.dataset.id,status:b.dataset.s}).then(load)};
$("ef").onsubmit=function(e){e.preventDefault();var f=this;api("employees/create",fd(f)).then(function(){f.reset();say($("em"),"Employee saved.",1);load()}).catch(function(x){say($("em"),x.message)})};
tok().then(function(){if(location.hash.indexOf("#reset=")==0){show("rs");$("rs").hidden=false}else enter()});
</script></body></html>
